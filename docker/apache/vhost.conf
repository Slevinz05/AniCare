<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted

        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/anicare_error.log
    CustomLog ${APACHE_LOG_DIR}/anicare_access.log combined
</VirtualHost>