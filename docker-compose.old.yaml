services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anicare_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - anicare_var:/var/www/html/var
      - anicare_uploads:/var/www/html/public/uploads
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: "change-me-for-local-dev"
      DATABASE_URL: "mysql://anicare:anicare@database:3306/anicare?serverVersion=8.4&charset=utf8mb4"
    depends_on:
      - database

  database:
    image: mysql:8.4
    container_name: anicare_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: anicare
      MYSQL_USER: anicare
      MYSQL_PASSWORD: anicare
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - anicare_database_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: anicare_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: database
      PMA_USER: anicare
      PMA_PASSWORD: anicare
    depends_on:
      - database

volumes:
  anicare_database_data:
  anicare_var:
  anicare_uploads:

  environment:
  APP_ENV: dev
  APP_DEBUG: "1"
  APP_SECRET: "change-me-for-local-dev"
  DATABASE_URL: "mysql://anicare:anicare@database:3306/anicare?serverVersion=8.4&charset=utf8mb4"
  DATABASE_HOST: database
  DATABASE_PORT: 3306
  RUN_MIGRATIONS: "0"