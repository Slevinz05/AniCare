# config/packages/security.yaml
security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        chatbot_api:
            pattern: ^/api/professionals/(chatbot|specialties)
            stateless: true
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\AppAuthenticator
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
                # where to redirect after logout
                # target: app_any_route

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                # by default, the feature is enabled by checking a checkbox in the
                # login form, uncomment the following line to always enable it.
                #always_remember_me: true

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/mes-chevaux, roles: ROLE_USER }
        - { path: ^/calendrier, roles: ROLE_USER }
        - { path: ^/consultations, roles: ROLE_USER }
        - { path: ^/poids, roles: ROLE_USER }
        - { path: ^/allergies, roles: ROLE_USER }
        - { path: ^/rendez-vous, roles: ROLE_USER }
        - { path: ^/messagerie, roles: ROLE_USER }
        - { path: ^/urgence, roles: ROLE_USER }
        - { path: ^/download, roles: ROLE_USER }
        - { path: ^/profil, roles: ROLE_USER }
        - { path: ^/partage, roles: ROLE_USER }
        - { path: ^/repertoire, roles: ROLE_PRO }
        - { path: ^/factures, roles: ROLE_PRO }
        - { path: ^/document, roles: ROLE_USER }

        # Exemples optionnels pour la hiérarchie future :
        # - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon